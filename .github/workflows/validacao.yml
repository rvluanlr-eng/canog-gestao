name: CANOG - validacao tecnica
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias da API e testes
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Executar testes automatizados
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias do React
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Compilar interface
        working-directory: frontend
        env:
          VITE_API_URL: https://example.invalid
        run: npm run build
      - name: Guardar build para inspeção (nao publicar)
        uses: actions/upload-artifact@v4
        with:
          name: canog-frontend-build
          path: frontend/dist/
          if-no-files-found: error
